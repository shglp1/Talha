<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 88" fill="none">
  <defs>
    <!-- Badge center (44,44), text ring radius 38.5 -->
    <!-- Top arc: right→top→left (CW, sweep=1) for RTL Arabic -->
    <path id="arcTop" d="M 82.5,44 A 38.5,38.5 0 0,1 5.5,44"/>
    <!-- Bottom arc: left→bottom→right (CW, sweep=1) for LTR English -->
    <path id="arcBot" d="M 5.5,44 A 38.5,38.5 0 0,1 82.5,44"/>
  </defs>

  <!-- ── BADGE ── -->
  <!-- Outer grey/taupe ring -->
  <circle cx="44" cy="44" r="43" fill="#9A8F7A"/>
  <!-- Inner ring separator line -->
  <circle cx="44" cy="44" r="33.5" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1.5"/>
  <!-- Gold inner circle -->
  <circle cx="44" cy="44" r="32" fill="#C5A84C"/>

  <!-- ── SCALES ICON (white, centered at 44,44) ── -->
  <!-- Decorative tip -->
  <polygon points="44,16.5 42.5,22 45.5,22" fill="white"/>
  <!-- Center pole -->
  <rect x="43.2" y="22" width="1.6" height="32" fill="white"/>
  <!-- Crossbar -->
  <rect x="27" y="27" width="34" height="1.6" fill="white"/>
  <!-- Left chain -->
  <line x1="28" y1="28.6" x2="28" y2="37.5" stroke="white" stroke-width="1.2"/>
  <!-- Right chain -->
  <line x1="60" y1="28.6" x2="60" y2="37.5" stroke="white" stroke-width="1.2"/>
  <!-- Left pan (bowl arc) -->
  <path d="M 22,37.5 Q 28,45.5 34,37.5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Right pan (bowl arc) -->
  <path d="M 54,37.5 Q 60,45.5 66,37.5" stroke="white" stroke-width="1.5" fill="none" stroke-linecap="round"/>
  <!-- Base decorative lines -->
  <rect x="37" y="52.5" width="14" height="1.4" rx="0.5" fill="white"/>
  <rect x="34" y="55" width="20" height="1.4" rx="0.5" fill="white" opacity="0.8"/>
  <rect x="31" y="57.5" width="26" height="1.4" rx="0.5" fill="white" opacity="0.6"/>

  <!-- ── RING TEXT ── -->
  <!-- Arabic text on top arc (RTL, centred) -->
  <text font-family="Tajawal, Arial, sans-serif" font-size="7" font-weight="500" fill="white">
    <textPath href="#arcTop" textAnchor="middle" startOffset="50%">د.طلحة غوث للمحاماة</textPath>
  </text>
  <!-- English text on bottom arc (LTR, centred) -->
  <text font-family="Georgia, serif" font-size="5.5" letter-spacing="0.25" fill="white" opacity="0.9">
    <textPath href="#arcBot" textAnchor="middle" startOffset="50%">Dr. Talha Ghouth Law Firm</textPath>
  </text>

  <!-- ── TEXT SECTION ── -->
  <!-- Vertical gold accent divider -->
  <rect x="101" y="17" width="1.5" height="54" rx="0.75" fill="#C5A84C" opacity="0.7"/>

  <!-- Arabic name — gold (visible on both dark footer and light navbar) -->
  <text
    x="113" y="43"
    font-family="Tajawal, Arial, sans-serif"
    font-size="23"
    font-weight="700"
    fill="#C5A84C"
    text-anchor="start"
  >د.طلحة غوث للمحاماة</text>

  <!-- English name — warm grey -->
  <text
    x="113" y="63"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="12.5"
    font-weight="600"
    letter-spacing="0.3"
    fill="#A09070"
    text-anchor="start"
  >Dr. Talha Ghouth Law Firm</text>
</svg>
